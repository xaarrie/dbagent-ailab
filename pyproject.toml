[project]
name = "dbagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'IBERNOVA\biarunxa', email = "x.arrieta@ibernova.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pydantic-ai>=2.56.0",
]

[project.scripts]
dbagent = "dbagent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]